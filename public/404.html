<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 · 页面不存在</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
           background:#f6f7f9; color:#1f2937; }
    .box { text-align:center; padding:40px 24px; }
    .code { font-size:72px; font-weight:700; color:#d1d5db; line-height:1; }
    h1 { font-size:20px; margin:16px 0 8px; }
    p { color:#6b7280; font-size:14px; margin:0 0 24px; }
    a { display:inline-block; padding:10px 22px; background:#2563eb; color:#fff; text-decoration:none;
        border-radius:8px; font-size:14px; }
    a:hover { background:#1d4ed8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>页面不存在</h1>
    <p>您访问的地址可能已被删除、更名，或从未存在过。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
