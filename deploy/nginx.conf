# ============================================================
# ai.xalcy.cn —— Nginx 站点配置
# 要点: 网站根目录必须指向 public/ (config.php / src / sql 在 web 根之外)
# 将本文件软链到 /etc/nginx/sites-enabled/ 后 `nginx -t && systemctl reload nginx`
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name ai.xalcy.cn www.ai.xalcy.cn;

    # 证书申请阶段可暂时注释 443 块；正式上线建议启用 HTTPS 并强制跳转
    # 若已配置 certbot，取消下面两行注释并删除 rewrite 关闭分支
    # listen 443 ssl http2;
    # include /etc/nginx/snippets/ssl-ai.xalcy.cn.conf;

    root /var/www/ai.xalcy.cn/public;   # 注意: 指向 public 目录
    index index.php index.html;

    # 访问与错误日志
    access_log /var/log/nginx/ai.xalcy.cn.access.log;
    error_log  /var/log/nginx/ai.xalcy.cn.error.log;

    # 强制 HTTPS(启用 443 后开启)
    # if ($scheme != "https") { return 301 https://$host$request_uri; }

    # 请求体上限：图片/视频上传都需要；视频单文件 100MB，建议 >= 此值并留余量
    client_max_body_size 120m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 上传目录（图片）：仅静态访问，禁止脚本执行（详见 deploy/nginx-uploads-snippet.conf）
    location ^~ /assets/uploads/ {
        location ~* \.(php|php[0-9]|phtml|phar|pl|py|cgi|sh|shtml|asp|aspx|jsp)$ {
            return 403;
        }
        add_header X-Content-Type-Options "nosniff" always;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 上传目录（视频）：仅静态访问，禁止脚本执行，支持 Range 拖动进度
    location ^~ /assets/videos/ {
        location ~* \.(php|php[0-9]|phtml|phar|pl|py|cgi|sh|shtml|asp|aspx|jsp)$ {
            return 403;
        }
        add_header X-Content-Type-Options "nosniff" always;
        expires 7d;
        add_header Cache-Control "public";
        add_header Accept-Ranges "bytes" always;
        access_log off;
    }

    # PHP 处理
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;   # 按实际 PHP 版本修改
        # 或 fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # 禁止访问隐藏文件 / 源码备份
    location ~ /\.(ht|git|env) { deny all; }
    location ~ \.(php\.bak|sql|json)$ { deny all; }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
