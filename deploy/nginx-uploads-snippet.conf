# ============================================================
# 上传目录安全片段 —— 贴到 1Panel 站点配置里（OpenResty/Nginx）
#
# 位置: 1Panel → 网站 → ai.xalcy.cn → 配置文件（或「伪静态」不适用，请改主配置）
#       把下面这段整体粘到 `server { ... }` 内、`location ~ \.php$ { ... }` 之前。
# 作用: /assets/uploads/ 只作静态图片访问，禁止其中任何文件被执行。
# ============================================================

    # ---- 上传目录（图片）：仅静态访问，禁止脚本执行 ----
    location ^~ /assets/uploads/ {
        # 命中脚本扩展名一律 403（^~ 前缀匹配后仍可用内层正则覆盖）
        location ~* \.(php|php[0-9]|phtml|phar|pl|py|cgi|sh|shtml|asp|aspx|jsp)$ {
            return 403;
        }
        # 防止浏览器把图片当别的类型解析
        add_header X-Content-Type-Options "nosniff" always;
        # 图片内容基本不变，长缓存；改图请换文件名（本接口每次上传都会生成新文件名）
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- 上传目录（视频）：仅静态访问，禁止脚本执行，支持 Range 拖动进度 ----
    location ^~ /assets/videos/ {
        location ~* \.(php|php[0-9]|phtml|phar|pl|py|cgi|sh|shtml|asp|aspx|jsp)$ {
            return 403;
        }
        add_header X-Content-Type-Options "nosniff" always;
        # 视频通常较长，缓存 7 天；改片请换文件名
        expires 7d;
        add_header Cache-Control "public";
        # 允许 Range 请求（浏览器拖动播放进度、断点续传需要）
        add_header Accept-Ranges "bytes" always;
        access_log off;
    }

    # ---- 品牌图目录（站点 LOGO / 浏览器图标）：仅静态访问，禁止脚本执行 ----
    location ^~ /assets/branding/ {
        location ~* \.(php|php[0-9]|phtml|phar|pl|py|cgi|sh|shtml|asp|aspx|jsp)$ {
            return 403;
        }
        add_header X-Content-Type-Options "nosniff" always;
        # 品牌图基本不变，长缓存；改图请换文件名（上传接口每次生成新文件名）
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

# ------------------------------------------------------------
# 配套建议（同 server 块内）
#   1) 请求体上限：需 >= 单文件上限（视频 100MB × max_files 5）并留余量，否则大请求会被 Nginx 先拦掉
#        client_max_body_size 120m;     # 配合 video.max_size 100MB × max_files 5（含 multipart 开销）
#   2) 若 PHP 在容器内，注意 PHP 的 post_max_size / upload_max_filesize 也要放大：
#        post_max_size = 128M
#        upload_max_filesize = 110M
#      1Panel 调整位置：运行环境 → PHP → 配置（php.ini）→ 保存并重载
#      品牌图(LOGO/图标)较小(2MB 上限)，不会触及上述上限，无需单独调整。
# ------------------------------------------------------------
